# Cloudflare Containers deployment config for the whatsontheriver v2
# cloud-side services (ingest API, read API). Real Neon DATABASE_URL
# secret is live (uploaded 2026-08-02 via `wrangler secret put`) and the
# schema is applied and verified against the actual database -- this is
# no longer purely theoretical, next step is the real `wrangler deploy`.

name = "whatsontheriver-api"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

[[containers]]
class_name = "WhatsOnTheRiverAPI"
image = "./Dockerfile"
max_instances = 1
# TODO once traffic is real: bump max_instances for the "two computers"
# redundancy Tom asked about -- this is where that lives, a config
# number, not a rebuild.

[[durable_objects.bindings]]
name = "API_CONTAINER"
class_name = "WhatsOnTheRiverAPI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsOnTheRiverAPI"]

[vars]
# Non-secret config only. DATABASE_URL, SQS creds, and per-source HMAC
# secrets go in via `wrangler secret put`, never committed here.
FRESH_CUTOFF_S = "300"
